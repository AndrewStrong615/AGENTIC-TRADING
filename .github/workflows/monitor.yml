name: repo-monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Install GitHub CLI (gh)
        run: |
          sudo apt-get update
          sudo apt-get install -y gh || true

      - name: Run backtest
        run: |
          python scripts/run_backtest.py
        continue-on-error: true

      - name: Run unit tests
        run: |
          python scripts/run_unit_tests.py
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monitor-artifacts
          path: artifacts/**

      - name: Run monitor and triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/monitor.py
        continue-on-error: true

      - name: Attempt conditional auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/conditional_auto_merge.py || true

      - name: Upload incident artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-artifacts
          path: artifacts/**
